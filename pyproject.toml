[project]
name = "vision-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ismail-ashraf", email = "iismmail23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas==3.1.0rc0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.170",
    "uvicorn>=0.54.0",
]

[project.scripts]
vision-core = "vision_core:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
